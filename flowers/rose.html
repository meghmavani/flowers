<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>ASCII Rose</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  body { display: flex; justify-content: center; align-items: center; }
  canvas { height: 100vh !important; width: auto !important; max-width: 100vw; object-fit: contain; }
  #hint { position: fixed; bottom: 10px; left: 0; right: 0; text-align: center;
          font: 12px monospace; color: #ffffff55; pointer-events: none; }
  #magic { position: fixed; top: 14px; left: 16px; right: 16px; text-align: center;
           font: 14px monospace; color: #ffffffcc; pointer-events: none; }
</style>
</head>
<body>
<div id="magic">click or press r again for some magic</div>
<div id="hint">click or press R to replay the bloom</div>

<script src="https://cdn.jsdelivr.net/npm/pixi.js@8.6.6/dist/pixi.min.js"></script>
<script>
(async () => {
  /* ---------- config ---------- */
  const COLS = 130, ROWS = 130;     // ascii grid
  const CW = 6, CH = 10;            // pixel size of one character cell
  const SS = 2;                     // supersampling per cell (SS x SS pixels averaged)
  const W = COLS * CW, H = ROWS * CH; // virtual scene size (matches screen space)
  const RAMP = ".,:;-~=+*#%@";
  const BASE = { x: 390, y: 1235 };

  /* ---------- display app (shows the ascii canvas) ---------- */
  const app = new PIXI.Application();
  await app.init({
    width: W, height: H, background: 0x000000,
    antialias: false, resolution: Math.min(window.devicePixelRatio || 1, 2), autoDensity: true,
  });
  document.body.appendChild(app.canvas);

  /* ---------- offscreen vector scene ---------- */
  const rt = PIXI.RenderTexture.create({ width: COLS * SS, height: ROWS * SS });
  const scene = new PIXI.Container();
  const world = new PIXI.Container();
  world.scale.set((COLS * SS) / W, (ROWS * SS) / H);
  scene.addChild(world);

  const grassLayer = new PIXI.Container();
  const stemLayer = new PIXI.Container();
  const leafLayer = new PIXI.Container();
  const flowerLayer = new PIXI.Container();
  world.addChild(grassLayer, stemLayer, leafLayer, flowerLayer);

  /* ---------- helpers ---------- */
  const clamp01 = (v) => Math.max(0, Math.min(1, v));
  const lerp = (a, b, t) => a + (b - a) * t;
  const easeOutCubic = (t) => 1 - Math.pow(1 - t, 3);
  const easeInOut = (t) => (t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2);
  const easeOutBack = (t) => { const c1 = 1.4, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); };
  const rnd = (a, b) => a + Math.random() * (b - a);
  const deg = Math.PI / 180;
  const normAngle = (a) => ((((a + Math.PI) % (2 * Math.PI)) + 2 * Math.PI) % (2 * Math.PI)) - Math.PI;

  /* ---------- petal / leaf shapes ---------- */
  // Petals are drawn in white and coloured with tint, so a rose can change
  // colour every frame without redrawing. role: index into [main, light, dark].
  function makeRosePetal(L, w, shade, parts) {
    const petal = new PIXI.Container();
    const addPart = (g, role) => { g.role = role; g.shade = shade; petal.addChild(g); parts.push(g); };

    addPart(new PIXI.Graphics()
      .moveTo(0, 0)
      .bezierCurveTo(w * 0.9, -L * 0.2, w * 1.25, -L * 0.95, 0, -L)
      .bezierCurveTo(-w * 1.25, -L * 0.95, -w * 0.9, -L * 0.2, 0, 0)
      .fill({ color: 0xffffff }), 0);
    // light catching the curled outer edge
    addPart(new PIXI.Graphics()
      .moveTo(-w * 0.72, -L * 0.72)
      .bezierCurveTo(-w * 0.4, -L * 1.0, w * 0.4, -L * 1.0, w * 0.72, -L * 0.72)
      .bezierCurveTo(w * 0.3, -L * 0.78, -w * 0.3, -L * 0.78, -w * 0.72, -L * 0.72)
      .fill({ color: 0xffffff, alpha: 1 }), 1);
    // shadow toward the heart of the flower
    addPart(new PIXI.Graphics()
      .moveTo(0, 0)
      .bezierCurveTo(w * 0.7, -L * 0.12, w * 0.55, -L * 0.35, 0, -L * 0.46)
      .bezierCurveTo(-w * 0.55, -L * 0.35, -w * 0.7, -L * 0.12, 0, 0)
      .fill({ color: 0xffffff, alpha: 0.5 }), 2);
    const edge = new PIXI.Graphics()
      .moveTo(0, 0)
      .bezierCurveTo(w * 0.9, -L * 0.2, w * 1.25, -L * 0.95, 0, -L)
      .bezierCurveTo(-w * 1.25, -L * 0.95, -w * 0.9, -L * 0.2, 0, 0)
      .stroke({ width: 9, color: 0xffffff, join: "round" });
    addPart(edge, 2);
    edge.shade = 1;
    return petal;
  }

  function makeLeaf(len, wide = 0.17) {
    const g = new PIXI.Graphics();
    g.moveTo(0, 0)
      .bezierCurveTo(len * wide, -len * 0.3, len * wide * 0.76, -len * 0.75, 0, -len)
      .bezierCurveTo(-len * wide * 0.76, -len * 0.75, -len * wide, -len * 0.3, 0, 0)
      .fill({ color: 0x2f9a35 });
    g.moveTo(0, -len * 0.05).lineTo(0, -len * 0.9).stroke({ width: 2.5, color: 0xb6f08a, alpha: 0.7 });
    return g;
  }

  /* ---------- bouquet definition ---------- */
  //  x,y = centre of the rose, L = radius of the head, d = start delay (s)
  const DEFS = [{ x: 390, y: 490, L: 275, d: 0 }];

  // [main, light, dark]
  const PALETTE = [
    [0xe4ddd4, 0xfaf6f0, 0x806c70], // white
    [0xffa6c8, 0xffdbe9, 0xa83a72], // soft pink
    [0xf2559a, 0xffa2ca, 0x8f1c5e], // rose pink
  ];

  const STEM_TIME = 2.2, BLOOM_DELAY = 1.9, BLOOM_TIME = 2.6;
  // Once the rose has opened it fades to a new colour for FADE_TIME, rests for
  // HOLD_TIME, then fades again.
  const FIRST_CHANGE = BLOOM_DELAY + BLOOM_TIME + 0.6;
  const FADE_TIME = 1.2, HOLD_TIME = 1.2;
  let flowers = [];
  let changing = null, nextChangeAt = FIRST_CHANGE, shownColor = -1;

  const otherColor = (current) => {
    const options = PALETTE.map((_, i) => i).filter((i) => i !== current);
    return options[Math.floor(Math.random() * options.length)];
  };

  // shade 0..1 darkens the colour, mix blends between two colours
  const mixColor = (a, b, m, shade = 1) => {
    const ch = (s) => Math.round(lerp((a >> s) & 255, (b >> s) & 255, m) * shade);
    return (ch(16) << 16) | (ch(8) << 8) | ch(0);
  };

  function paintRose(f, m) {
    const from = PALETTE[f.colorFrom], to = PALETTE[f.colorTo];
    f.parts.forEach((part) => { part.tint = mixColor(from[part.role], to[part.role], m, part.shade); });
  }

  function updateColors(t) {
    if (!changing && t >= nextChangeAt) {
      const f = flowers[0];
      f.colorFrom = f.colorTo;
      f.colorTo = otherColor(f.colorTo);
      shownColor = f.colorTo;
      changing = { f, start: t };
    }
    if (!changing) return;
    const raw = clamp01((t - changing.start) / FADE_TIME);
    paintRose(changing.f, easeInOut(raw));
    changing.f.pulse = Math.sin(raw * Math.PI) * 0.04; // small swell as it turns
    if (raw >= 1) {
      changing.f.pulse = 0;
      changing = null;
      nextChangeAt = t + HOLD_TIME;
    }
  }

  function buildScene() {
    [grassLayer, stemLayer, leafLayer, flowerLayer].forEach((l) => l.removeChildren().forEach((c) => c.destroy({ children: true })));
    flowers = [];
    changing = null; nextChangeAt = FIRST_CHANGE;

    // every replay starts on a different colour from the one on screen
    shownColor = otherColor(shownColor);
    const dealColor = () => shownColor;

    // draw back-to-front: top flowers first
    const sorted = [...DEFS].sort((a, b) => a.y - b.y);
    sorted.forEach((def) => {
      const sx = BASE.x + rnd(-28, 28), sy = BASE.y;
      const ctrl = { x: lerp(sx, def.x, 0.35) + rnd(-20, 20), y: def.y + (sy - def.y) * 0.5 };
      const stemG = new PIXI.Graphics();
      stemLayer.addChild(stemG);

      // broad leaves along the stem
      const firstSide = Math.random() < 0.5 ? 1 : -1;
      const leaves = [0.22, 0.4, 0.58].map((t, i) => {
        const lf = makeLeaf(rnd(170, 230), 0.26);
        lf.t = t; lf.side = i % 2 ? -firstSide : firstSide;
        lf.scale.set(0);
        leafLayer.addChild(lf);
        return lf;
      });

      // head: rings of petals, outermost first, each ring tighter and deeper
      const head = new PIXI.Container();
      const inner = new PIXI.Container();
      head.addChild(inner);
      head.finalRot = rnd(-0.35, 0.35);
      const petals = [];
      const parts = [];
      const L = def.L;
      [
        { n: 5, r: 1.0, w: 0.74, shade: 1.0, off: 0 },
        { n: 5, r: 0.78, w: 0.72, shade: 0.95, off: 36 },
        { n: 4, r: 0.57, w: 0.72, shade: 0.9, off: 20 },
        { n: 3, r: 0.38, w: 0.8, shade: 0.85, off: 75 },
      ].forEach((ring, ringIdx) => {
        for (let k = 0; k < ring.n; k++) {
          const p = makeRosePetal(L * ring.r, L * ring.r * ring.w, ring.shade, parts);
          p.openAngle = normAngle((ring.off + (k * 360) / ring.n + rnd(-7, 7)) * deg);
          p.closedAngle = (k - (ring.n - 1) / 2) * 7 * deg;
          p.lag = ringIdx * 0.09; // outer petals unfurl first
          inner.addChild(p);
          petals.push(p);
        }
      });
      // the tight spiral at the very centre
      const heart = new PIXI.Graphics().circle(0, 0, L * 0.21).fill({ color: 0xffffff });
      heart.role = 1; heart.shade = 0.92;
      inner.addChild(heart);
      parts.push(heart);
      const spiral = new PIXI.Graphics();
      for (let i = 0; i <= 40; i++) {
        const u = i / 40, a = u * Math.PI * 3.5, rad = L * (0.01 + 0.2 * u);
        const x = Math.cos(a) * rad, y = Math.sin(a) * rad;
        if (i === 0) spiral.moveTo(x, y); else spiral.lineTo(x, y);
      }
      spiral.stroke({ width: 11, color: 0xffffff, cap: "round", join: "round" });
      spiral.role = 2; spiral.shade = 1;
      inner.addChild(spiral);
      parts.push(spiral);
      head.visible = false;
      flowerLayer.addChild(head);

      const color = dealColor();
      const f = {
        def, sx, sy, ctrl, stemG, leaves, head, inner, petals, parts,
        colorFrom: color, colorTo: color, pulse: 0,
        swayPhase: rnd(0, 6.28),
      };
      paintRose(f, 1);
      flowers.push(f);
    });
  }

  const bez = (f, t) => {
    const u = 1 - t;
    return {
      x: u * u * f.sx + 2 * u * t * f.ctrl.x + t * t * f.def.x,
      y: u * u * f.sy + 2 * u * t * f.ctrl.y + t * t * f.def.y,
    };
  };
  const bezAngle = (f, t) => {
    const u = 1 - t;
    const dx = 2 * u * (f.ctrl.x - f.sx) + 2 * t * (f.def.x - f.ctrl.x);
    const dy = 2 * u * (f.ctrl.y - f.sy) + 2 * t * (f.def.y - f.ctrl.y);
    return Math.atan2(dx, -dy); // 0 = pointing up
  };

  /* ---------- per-frame scene update ---------- */
  function updateScene(t) {
    flowers.forEach((f) => {
      const local = t - f.def.d;
      const p = easeInOut(clamp01(local / STEM_TIME));
      const o = easeOutBack(clamp01((local - BLOOM_DELAY) / BLOOM_TIME));
      const oc = clamp01(o);
      const sway = Math.sin(t * 1.3 + f.swayPhase) * 0.02;

      // stem: polyline up to p
      f.stemG.clear();
      if (p > 0.001) {
        const N = 28, n = Math.max(2, Math.ceil(N * p));
        const pts = [];
        for (let i = 0; i <= n; i++) pts.push(bez(f, (i / n) * p));
        f.stemG.moveTo(pts[0].x, pts[0].y);
        pts.forEach((q) => f.stemG.lineTo(q.x, q.y));
        f.stemG.stroke({ width: 16, color: 0x2a8a2e, cap: "round", join: "round" });
        f.stemG.moveTo(pts[0].x - 2, pts[0].y);
        pts.forEach((q) => f.stemG.lineTo(q.x - 2, q.y));
        f.stemG.stroke({ width: 3, color: 0x8fe07a, alpha: 0.7, cap: "round", join: "round" });
      }

      // leaves
      f.leaves.forEach((lf) => {
        const g = easeOutCubic(clamp01((p - lf.t) / 0.25));
        const q = bez(f, lf.t);
        lf.x = q.x; lf.y = q.y;
        lf.rotation = bezAngle(f, lf.t) + lf.side * (48 * deg) + sway * 2;
        lf.scale.set(g);
      });

      // head: bud at stem tip, then bloom
      const tip = bez(f, p);
      f.head.visible = p > 0.05;
      f.head.x = tip.x; f.head.y = tip.y;
      f.head.rotation = lerp(bezAngle(f, Math.max(p, 0.02)), f.head.finalRot, easeInOut(oc)) + sway;
      const budScale = lerp(0.18, 1, o) * (1 + f.pulse);
      f.inner.scale.set(budScale, budScale * 0.92); // turned slightly toward the viewer

      f.petals.forEach((pt) => {
        const open = clamp01((oc - pt.lag) / (1 - pt.lag));
        pt.rotation = lerp(pt.closedAngle, pt.openAngle, open);
        pt.scale.set(lerp(0.55, 1, open), lerp(0.85, 1, open));
      });
    });
  }

  /* ---------- ascii canvas ---------- */
  const ascii = document.createElement("canvas");
  ascii.width = W; ascii.height = H;
  const ctx = ascii.getContext("2d");
  ctx.textBaseline = "top";
  ctx.font = `bold ${CH}px "SF Mono", Menlo, Consolas, monospace`;
  const sprite = new PIXI.Sprite(PIXI.Texture.from(ascii));
  app.stage.addChild(sprite);

  const stars = [...Array(90)].map(() => ({
    c: Math.floor(rnd(0, COLS)), r: Math.floor(rnd(0, ROWS)), ph: rnd(0, 6.28), sp: rnd(0.8, 2.4),
  }));

  function readPixels() {
    const res = app.renderer.extract.pixels({ target: rt });
    return res && res.pixels ? res : { pixels: res, width: rt.width, height: rt.height };
  }

  function drawAscii(t) {
    app.renderer.render({ container: scene, target: rt, clear: true, clearColor: [0, 0, 0, 1] });
    const { pixels, width: pw } = readPixels();

    ctx.fillStyle = "#000";
    ctx.fillRect(0, 0, W, H);

    // twinkling background stars
    ctx.font = `${CH}px "SF Mono", Menlo, Consolas, monospace`;
    stars.forEach((s) => {
      const a = 0.15 + 0.35 * (0.5 + 0.5 * Math.sin(t * s.sp + s.ph));
      ctx.fillStyle = `rgba(255,255,255,${a.toFixed(2)})`;
      ctx.fillText(".", s.c * CW, s.r * CH);
    });

    ctx.font = `bold ${CH + 1}px "SF Mono", Menlo, Consolas, monospace`;
    const inv = 1 / (SS * SS);
    for (let r = 0; r < ROWS; r++) {
      for (let c = 0; c < COLS; c++) {
        let R = 0, G = 0, B = 0;
        for (let sy = 0; sy < SS; sy++) {
          for (let sx = 0; sx < SS; sx++) {
            const i = ((r * SS + sy) * pw + (c * SS + sx)) * 4;
            R += pixels[i]; G += pixels[i + 1]; B += pixels[i + 2];
          }
        }
        R *= inv; G *= inv; B *= inv;
        const lum = 0.299 * R + 0.587 * G + 0.114 * B;
        if (lum < 14) continue;
        let idx = Math.round(clamp01(lum / 215) * (RAMP.length - 1));
        const j = Math.random();
        if (j < 0.08) idx = Math.max(0, idx - 1); else if (j > 0.94) idx = Math.min(RAMP.length - 1, idx + 1);
        const k = 1.25;
        ctx.fillStyle = `rgb(${Math.min(255, R * k) | 0},${Math.min(255, G * k) | 0},${Math.min(255, B * k) | 0})`;
        ctx.fillText(RAMP[idx], c * CW, r * CH);
      }
    }
    sprite.texture.source.update();
  }

  /* ---------- run / replay ---------- */
  let t0 = performance.now();
  function replay() { buildScene(); t0 = performance.now(); }
  buildScene();

  app.ticker.add(() => {
    const t = (performance.now() - t0) / 1000;
    updateColors(t);
    updateScene(t);
    drawAscii(t);
  });

  window.addEventListener("keydown", (e) => { if (e.key.toLowerCase() === "r") replay(); });
  window.addEventListener("pointerdown", replay);
})();
</script>
</body>
</html>
